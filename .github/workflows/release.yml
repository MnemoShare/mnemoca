name: Release

# Tagged releases publish the vetted image to Docker Hub
# (docker.io/mnemoshare/mnemoca) for Docker Scout analysis. Everyday builds
# stay on GHCR via ci.yml; production releases pass through the same human
# gate as the app release workflow (Settings → Environments → production).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g., v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Tests (FIPS 140-3 runtime mode)
        run: GODEBUG=fips140=on go test ./...
      - name: Tests (race)
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  docker-publish:
    runs-on: ubuntu-latest
    # Require manual approval before any tag pushes images to Docker Hub.
    # Configure required reviewers in repo Settings → Environments → production.
    environment: production
    needs: [test]
    permissions:
      contents: write # GitHub Release creation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${DISPATCH_VERSION:-$REF_NAME}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build and push (FIPS 140-3, SBOM, provenance)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=v${{ steps.version.outputs.version }}
          tags: |
            mnemoshare/mnemoca:${{ steps.version.outputs.version }}
            mnemoshare/mnemoca:latest

      - name: Docker Scout CVE scan (gate)
        uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
        with:
          command: cves
          image: mnemoshare/mnemoca:${{ steps.version.outputs.version }}
          only-severities: critical,high
          exit-code: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "MnemoCA v${VERSION}" \
            --generate-notes \
            --verify-tag
