name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Tests (FIPS 140-3 runtime mode)
        run: GODEBUG=fips140=on go test ./...
      - name: Tests (race)
        run: go test -race ./...
      - name: Tests (validated FIPS module)
        run: GOFIPS140=v1.0.0 go test ./internal/pkix/ ./internal/ca/ ./internal/acme/
      - name: Fuzz smoke (30s per parser)
        run: |
          for f in FuzzParseCertificate FuzzParseCertificateRequest FuzzParseCRL FuzzParsePublicKey; do
            go test -run '^$' -fuzz "${f}\$" -fuzztime 30s ./internal/pkix/
          done

  test-mongo:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      MNEMOCA_TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Tests against MongoDB (store conformance, store audit, CA end-to-end)
        run: go test ./internal/store/ ./internal/audit/ ./internal/ca/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  image:
    needs: [test, test-mongo, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mnemoshare/mnemoca
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
