name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: k8s-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The post-step cache save hangs on the persistent metal runners.
          cache: false
          go-version: "1.26"
      - name: Tests (FIPS 140-3 runtime mode)
        run: GODEBUG=fips140=on go test ./...
      - name: Tests (race)
        run: go test -race ./...
      - name: Tests (validated FIPS module)
        run: GOFIPS140=v1.0.0 go test ./internal/pkix/ ./internal/ca/ ./internal/acme/
      - name: Fuzz smoke (30s per parser)
        run: |
          for f in FuzzParseCertificate FuzzParseCertificateRequest FuzzParseCRL FuzzParsePublicKey; do
            go test -run '^$' -fuzz "${f}\$" -fuzztime 30s ./internal/pkix/
          done

  test-mongo:
    runs-on: k8s-ci
    services:
      mongo:
        image: mongo:8
        # Several runners share one metal host, so let Docker pick the host port.
        ports:
          - 27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The post-step cache save hangs on the persistent metal runners.
          cache: false
          go-version: "1.26"
      - name: Tests against MongoDB (store conformance, store audit, CA end-to-end)
        env:
          MNEMOCA_TEST_MONGO_URI: mongodb://localhost:${{ job.services.mongo.ports['27017'] }}
        run: go test ./internal/store/ ./internal/audit/ ./internal/ca/

  lint:
    runs-on: k8s-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The post-step cache save hangs on the persistent metal runners.
          cache: false
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  image:
    needs: [test, test-mongo, lint]
    if: github.event_name == 'push'
    runs-on: k8s-ci
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mnemoshare/mnemoca
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      # The persistent metal runners reach GitHub's Actions cache at a few
      # hundred KB/s, so type=gha restores ran for many minutes. Each runner keeps
      # its own BuildKit cache on local disk instead; a runner runs one job at a
      # time, so there is never a concurrent writer.
      - name: Locate the runner-local build cache
        id: buildcache
        run: echo "dir=$(dirname "$RUNNER_WORKSPACE")/_buildx-cache/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=${{ steps.buildcache.outputs.dir }}
          cache-to: type=local,dest=${{ steps.buildcache.outputs.dir }}-new,mode=max

      # A local cache export only ever adds blobs; swapping in the fresh export
      # keeps it at one build's worth instead of growing without bound.
      - name: Rotate the build cache
        env:
          CACHE_DIR: ${{ steps.buildcache.outputs.dir }}
        run: |
          rm -rf "$CACHE_DIR"
          mv "$CACHE_DIR-new" "$CACHE_DIR"
          du -sh "$CACHE_DIR"
