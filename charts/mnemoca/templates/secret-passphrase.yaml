{{- if and (not .Values.passphrase.existingSecret) .Values.passphrase.generate (eq .Values.store.type "bolt") }}
{{- $name := include "mnemoca.passphraseSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mnemoca.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.passphrase.existingSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.passphrase.existingSecretKey }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
